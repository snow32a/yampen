name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsecret-1-dev \
            libgtk-4-dev librsvg2-dev libcurl4-openssl-dev libssl-dev libcjson-dev
      - name: Build
        run: |
          ./configure linux
          make
          tar -czf yampen-$GITHUB_REF_NAME-linux-x86_64.tar.gz -C build .
          mv yampen-$GITHUB_REF_NAME-linux-x86_64.tar.gz build/
          cd build
          sha256sum yampen-$GITHUB_REF_NAME-linux-x86_64.tar.gz > yampen-$GITHUB_REF_NAME-linux-x86_64.tar.gz.sha256
          echo "$GITHUB_REF_NAME" > version.txt
          cp ../packaging/arch-bin/PKGBUILD ./
          sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" PKGBUILD
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/yampen-${{ github.ref_name }}-linux-x86_64.tar.gz
            build/yampen-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            build/PKGBUILD
            build/version.txt