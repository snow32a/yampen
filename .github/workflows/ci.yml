name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsecret-1-dev \
            libgtk-4-dev librsvg2-dev libcurl4-openssl-dev libssl-dev libcjson-dev
      - name: Build
        run: |
          ./configure linux
          make