name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsecret-1-dev \
            libgtk-4-dev librsvg2-dev libcurl4-openssl-dev libssl-dev libcjson-dev
      - name: Build
        run: |
          ./configure linux
          make
          sha256sum build/yampen > build/yampen-linux-bin.sha256
          mv build/yampen build/yampen-linux-bin
          echo "${GITHUB_REF_NAME}" > build/version.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/yampen-linux-bin
            build/yampen-linux-bin.sha256
            build/version.txt